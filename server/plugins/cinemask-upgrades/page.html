<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinemask Upgrades</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #646a76; --line: #dde1e7; --accent: #0f9d8f; --danger: #c43d3d; --chip: #eef0f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d0f13; --panel: #171a21; --text: #e9ecf1; --muted: #9098a6; --line: #2a2f39; --accent: #2cc3b2; --danger: #ef6b6b; --chip: #232833; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p { margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .error { color: var(--danger); }
  .ok { color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  input, select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
  button { font: inherit; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); font-weight: 600; }
  .list { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; }
  .item { border-top: 1px solid var(--line); padding: 12px 16px; }
  .item:first-child { border-top: 0; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; margin: 2px 4px 0 0; }
  .panel { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .eps { margin: 6px 0 0; padding: 0; list-style: none; columns: 2 260px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { text-align: left; padding: 6px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.title { word-break: break-word; }
  .empty { padding: 24px 16px; text-align: center; }
  @media (max-width: 600px) { .hide-sm { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Upgrades</h1>
  <p class="muted">Movies and episodes below the quality you want, judged from the files themselves. Cinemask searches its
    indexers for better copies. What counts as worth upgrading, and the Cinemask address and key, are under
    Admin → Plugins → Cinemask Upgrades → Settings.</p>
  <p id="cm" class="small"></p>
  <p id="summary"></p>
  <div class="row">
    <button id="rescan" type="button">Rescan</button>
    <button id="all" type="button" class="primary">Search all in Cinemask</button>
  </div>
  <p id="bulk" class="small" role="status" style="margin-top:8px"></p>
  <div class="tabs" role="tablist">
    <button id="tabMovies" role="tab" aria-selected="true" type="button">Movies</button>
    <button id="tabShows" role="tab" aria-selected="false" type="button">Shows</button>
    <span class="grow"></span>
    <input id="filter" placeholder="Filter" aria-label="Filter by title" style="margin-bottom:4px">
  </div>
  <div id="list" class="list"></div>
</main>
<script>
  const base = location.pathname.replace(/\/?$/, '/')
  const call = async (method, path, body) => {
    const res = await fetch(base + path, {
      method, credentials: 'same-origin',
      headers: { 'X-Requested-With': 'BingeBandit', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    })
    if (res.status === 204 || res.status === 202) return null
    const data = await res.json().catch(() => null)
    if (!res.ok) throw new Error((data && data.error) || res.statusText)
    return data
  }
  const $ = (id) => document.getElementById(id)
  // Attributes with a dash (aria-label) aren't properties, so they're set as attributes.
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag)
    for (const [k, v] of Object.entries(props)) k.includes('-') ? n.setAttribute(k, v) : (n[k] = v)
    n.append(...kids.filter((k) => k != null && k !== false)); return n
  }
  const size = (b) => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB'
  const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many}`
  const epLabel = (e) => `S${String(e.season).padStart(2, '0')}E${String(e.episode).padStart(2, '0')}`

  let data = null, tab = 'movies', cmOK = false

  async function load(refresh) {
    $('summary').textContent = refresh ? 'Scanning…' : 'Loading…'
    try {
      data = await call('GET', 'report' + (refresh ? '?refresh=1' : ''))
    } catch (e) { $('summary').textContent = e.message; $('summary').className = 'error'; return }
    const r = data.report, cm = data.cinemask
    cmOK = cm.ok
    $('cm').textContent = cm.ok ? `Connected to Cinemask as ${cm.user}.` : `Cinemask: ${cm.error}`
    $('cm').className = 'small ' + (cm.ok ? 'ok' : 'error')
    const eps = r.shows.reduce((n, s) => n + s.episodes.length, 0)
    $('summary').className = ''
    const found = [r.movies.length && plural(r.movies.length, 'movie', 'movies'),
      eps && `${plural(eps, 'episode', 'episodes')} in ${plural(r.shows.length, 'show', 'shows')}`].filter(Boolean)
    $('summary').textContent = `Aiming for ${r.target}, out of ${plural(r.files, 'file', 'files')}: ` +
      (found.length ? `${found.join(' and ')} could be better.` : 'nothing to upgrade.')
    $('all').disabled = !cmOK || data.bulk.running || (!r.movies.length && !r.shows.length)
    showBulk(data.bulk)
    render()
  }

  function showBulk(b) {
    if (!b || !b.total) { $('bulk').textContent = ''; return }
    const parts = [b.running ? `Searching ${b.done + 1} of ${b.total}${b.current ? ' (' + b.current + ')' : ''}` : `Last search all: ${b.done} of ${b.total} searched`,
      `${plural(b.grabbed, 'release', 'releases')} sent to download`]
    if (b.skipped) parts.push(`${b.skipped} not in Cinemask (skipped)`)
    if (b.errors.length) parts.push(`${plural(b.errors.length, 'error', 'errors')}: ${b.errors.slice(0, 3).join('; ')}`)
    $('bulk').replaceChildren(...[parts.join('. ') + '.', b.running && el('button', { type: 'button', textContent: 'Stop', style: 'margin-left:8px;padding:2px 10px',
      onclick: () => call('POST', 'search-all/stop').then(poll) })].filter(Boolean))
    $('bulk').className = 'small ' + (b.errors.length ? 'error' : 'muted')
  }

  let pollTimer = null
  async function poll() {
    clearTimeout(pollTimer)
    try {
      const d = await call('GET', 'report')
      data.bulk = d.bulk; showBulk(d.bulk)
      $('all').disabled = !cmOK || d.bulk.running
      if (d.bulk.running) pollTimer = setTimeout(poll, 3000)
    } catch { pollTimer = setTimeout(poll, 10000) }
  }

  function render() {
    if (!data) return
    const q = $('filter').value.trim().toLowerCase()
    const rows = (tab === 'movies' ? data.report.movies : data.report.shows).filter((x) => !q || x.title.toLowerCase().includes(q))
    if (!rows.length) {
      $('list').replaceChildren(el('div', { className: 'empty muted', textContent: q ? 'Nothing matches.' : tab === 'movies' ? 'Every movie is good enough.' : 'Every episode is good enough.' }))
      return
    }
    $('list').replaceChildren(...rows.slice(0, 500).map((x) => tab === 'movies' ? movieRow(x) : showRow(x)),
      ...(rows.length > 500 ? [el('div', { className: 'empty muted small', textContent: `And ${rows.length - 500} more; filter to find them.` })] : []))
  }

  function chips(reasons) { return reasons.map((r) => el('span', { className: 'chip', textContent: r })) }

  function movieRow(m) {
    const box = el('div', { className: 'item' })
    const open = el('button', { type: 'button', textContent: 'Cinemask…', disabled: !cmOK || !m.tmdbId, title: m.tmdbId ? '' : 'No TMDB match' })
    box.append(el('div', { className: 'row' },
      el('div', { className: 'grow' },
        el('div', {}, el('a', { href: `/item/${m.itemId}`, target: '_top', textContent: m.title }), m.year ? ` (${m.year})` : ''),
        el('div', { className: 'small muted' }, `${m.quality} · ${size(m.size)}`), el('div', {}, ...chips(m.reasons))),
      open))
    open.onclick = () => togglePanel(box, { kind: 'movie', tmdbId: m.tmdbId })
    return box
  }

  function showRow(s) {
    const box = el('div', { className: 'item' })
    const open = el('button', { type: 'button', textContent: 'Cinemask…', disabled: !cmOK || !s.tmdbId, title: s.tmdbId ? '' : 'No TMDB match' })
    const reasons = [...new Set(s.episodes.flatMap((e) => e.reasons))]
    const eps = el('ul', { className: 'eps', hidden: true }, ...s.episodes.map((e) => el('li', {}, el('b', { textContent: epLabel(e) }), ` ${e.quality}`)))
    const more = el('button', { type: 'button', textContent: 'Episodes', style: 'padding:2px 10px;font-size:13px' })
    more.onclick = () => { eps.hidden = !eps.hidden }
    box.append(el('div', { className: 'row' },
      el('div', { className: 'grow' },
        el('div', {}, el('a', { href: `/item/${s.showId}`, target: '_top', textContent: s.title })),
        el('div', { className: 'small muted' }, `${s.episodes.length} of ${s.total} episodes `, more), el('div', {}, ...chips(reasons))),
      open), eps)
    open.onclick = () => togglePanel(box, { kind: 'show', tmdbId: s.tmdbId, episodes: s.episodes })
    return box
  }

  // The Cinemask panel for one title: add it, change its profile, search, or pick a release.
  async function togglePanel(box, t) {
    const old = box.querySelector('.panel')
    if (old) { old.remove(); return }
    const panel = el('div', { className: 'panel small', textContent: 'Asking Cinemask…' })
    box.append(panel)
    let info
    try { info = await call('GET', `title?kind=${t.kind}&tmdb=${t.tmdbId}`) } catch (e) { panel.replaceChildren(el('span', { className: 'error', textContent: e.message })); return }
    const msg = el('p', { role: 'status', style: 'margin:8px 0 0' })
    const say = (text, cls = '') => { msg.textContent = text; msg.className = cls }
    const link = el('a', { href: info.link, target: '_blank', rel: 'noopener', textContent: 'Open in Cinemask' })
    const profilePick = (current) => el('select', { 'aria-label': 'Quality profile' },
      ...info.profiles.map((p) => el('option', { value: p.id, selected: p.id === current, textContent: `${p.name} (up to ${p.cutoff}${p.upgradesAllowed ? '' : ', no upgrades'})` })))
    const m = info.monitored

    if (!m) {
      const pick = profilePick(info.profiles[0] && info.profiles[0].id)
      const add = el('button', { type: 'button', className: 'primary', textContent: 'Add to Cinemask' })
      add.onclick = async () => {
        add.disabled = true; say('Adding…')
        try { await call('POST', 'monitor', { kind: t.kind, tmdbId: t.tmdbId, profileId: Number(pick.value) }); panel.remove(); togglePanel(box, t) }
        catch (e) { say(e.message, 'error'); add.disabled = false }
      }
      panel.replaceChildren(el('p', {}, 'Cinemask doesn\'t monitor this yet. Add it with a profile that allows the quality you want; it won\'t search until you ask. ', link),
        el('div', { className: 'row' }, pick, add), msg)
      return
    }

    const onDisk = t.kind === 'movie' ? m.fileQuality : null
    const pick = profilePick(m.profileId)
    let scope = null
    if (t.kind === 'show') {
      const seasons = [...new Set(t.episodes.map((e) => e.season))]
      scope = el('select', { 'aria-label': 'What to search for' },
        el('option', { value: '', textContent: 'Everything Cinemask still wants' }),
        ...seasons.map((s) => el('option', { value: JSON.stringify({ season: s }), textContent: `Season ${s}` })),
        ...t.episodes.map((e) => el('option', { value: JSON.stringify({ season: e.season, episode: e.episode }), textContent: `${epLabel(e)} (${e.quality})` })))
    }
    const target = () => ({ kind: t.kind, tmdbId: t.tmdbId, ...(scope && scope.value ? JSON.parse(scope.value) : {}) })
    const auto = el('button', { type: 'button', className: 'primary', textContent: 'Search and grab' })
    const manual = el('button', { type: 'button', textContent: 'Show releases' })
    const table = el('div')
    auto.onclick = async () => {
      auto.disabled = manual.disabled = true; say('Searching… this can take a minute.')
      try {
        const r = await call('POST', 'search', { ...target(), profileId: Number(pick.value) })
        m.profileId = Number(pick.value)
        const errs = (r.errors || []).length ? ` (${r.errors.join('; ')})` : ''
        say((r.message || (r.grabbed ? `Sent ${plural(r.grabbed, 'release', 'releases')} to download.` : 'Nothing better found.')) + errs, r.grabbed ? 'ok' : '')
      } catch (e) { say(e.message, 'error') }
      auto.disabled = manual.disabled = false
    }
    manual.onclick = async () => {
      auto.disabled = manual.disabled = true; say('Searching… this can take a minute.'); table.replaceChildren()
      try {
        const r = await call('POST', 'releases', { ...target(), profileId: Number(pick.value) })
        m.profileId = Number(pick.value)
        const rel = r.releases.sort((a, b) => b.accepted - a.accepted)
        say(`${plural(rel.length, 'release', 'releases')} found, ${rel.filter((x) => x.accepted).length} acceptable.` + ((r.errors || []).length ? ` (${r.errors.join('; ')})` : ''))
        if (rel.length) table.replaceChildren(el('table', {},
          el('thead', {}, el('tr', {}, ...['Release', 'Quality', 'Size', 'Source', ''].map((h, i) => el('th', { className: i === 3 ? 'hide-sm' : '', textContent: h })))),
          el('tbody', {}, ...rel.slice(0, 100).map((x) => {
            const grab = el('button', { type: 'button', textContent: x.grabbed ? x.grabbed : 'Grab', disabled: !!x.grabbed, style: 'padding:2px 10px' })
            grab.onclick = async () => {
              grab.disabled = true
              try { await call('POST', 'grab', { ...target(), guid: x.guid }); grab.textContent = 'Sent'; say(`Sent ${x.title} to download.`, 'ok') }
              catch (e) { grab.disabled = false; say(e.message, 'error') }
            }
            return el('tr', {},
              el('td', { className: 'title' }, x.title, x.accepted ? null : el('div', { className: 'muted', textContent: x.rejections.join('; ') })),
              el('td', { textContent: x.quality }), el('td', { textContent: size(x.size) }),
              el('td', { className: 'hide-sm', textContent: x.indexer + (x.seeders != null ? ` · ${x.seeders} seeders` : '') }),
              el('td', {}, grab))
          }))))
      } catch (e) { say(e.message, 'error') }
      finally { auto.disabled = manual.disabled = false }
    }
    panel.replaceChildren(
      el('p', {}, `In Cinemask with the ${m.profile.name} profile, which stops at ${m.profile.cutoff}.`,
        onDisk ? ` Cinemask has this file as ${onDisk}.` : '', m.monitored ? ' ' : ' It isn\'t monitored, but searches here still run. ', link),
      el('p', { className: 'muted' }, 'Cinemask only grabs a release that beats what it has on disk and is within the profile. To go higher, pick a profile with a higher cutoff; searching moves the title to it first.'),
      el('div', { className: 'row' }, pick, scope, auto, manual), msg, table)
  }

  $('tabMovies').onclick = () => { tab = 'movies'; $('tabMovies').setAttribute('aria-selected', 'true'); $('tabShows').setAttribute('aria-selected', 'false'); render() }
  $('tabShows').onclick = () => { tab = 'shows'; $('tabShows').setAttribute('aria-selected', 'true'); $('tabMovies').setAttribute('aria-selected', 'false'); render() }
  $('filter').oninput = render
  $('rescan').onclick = () => load(true)
  $('all').onclick = async () => {
    if (!confirm('Have Cinemask search for every title listed here that it monitors, one at a time? It grabs whatever beats the file it has, within each title\'s profile.')) return
    try { await call('POST', 'search-all'); poll() } catch (e) { $('bulk').textContent = e.message; $('bulk').className = 'small error' }
  }
  load(false).then(() => { if (data && data.bulk.running) poll() })
</script>
</body>
</html>
