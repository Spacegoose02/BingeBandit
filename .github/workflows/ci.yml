name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Check formatting
        working-directory: server
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and test server
        working-directory: server
        run: go vet ./... && go test ./...

  tv-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json
      - name: Type-check and lint the TV app
        working-directory: apps/tv
        run: npm ci && npx tsc --noEmit && npx eslint App.tsx src

  desktop-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test the Windows app
        working-directory: apps/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          # Skip man-db's index rebuild, which can take minutes on the runners.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mpv ffmpeg
          npm ci && npm test

  roku-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the Roku channel
        working-directory: apps/roku
        run: npx --yes brighterscript@0.69.13 --project bsconfig.json
      - name: Build the sideload zip
        working-directory: apps/roku
        run: ./build.sh
      # GitHub wraps artifacts in a zip of their own: unzip the download once
      # to get BingeBandit-Roku.zip, which is what the Roku takes.
      - uses: actions/upload-artifact@v4
        with:
          name: BingeBandit-Roku
          path: apps/roku/build/BingeBandit-Roku.zip
