# Push a tag like v0.1.0 to publish binaries to GitHub Releases and an image to GHCR.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Cross-compile
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../release
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            out="bingebandit-${GITHUB_REF_NAME}-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "../release/$out" ./cmd/bingebandit
            # Bundled plugins: unzip into a "plugins" folder next to the server.
            for p in watchlist-rss hue-sync cinemask-upgrades game-lights youtube-live; do
              rm -rf "/tmp/pl/$p" && mkdir -p "/tmp/pl/$p"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "/tmp/pl/$p/$p${ext}" "./plugins/$p"
              jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' "plugins/$p/plugin.json" > "/tmp/pl/$p/plugin.json"
              (cd /tmp/pl && zip -qr "$GITHUB_WORKSPACE/release/plugin-$p-${GITHUB_REF_NAME}-${os}-${arch}.zip" "$p")
            done
          done
      - name: Plugin catalogue
        # Admin → Plugins → Catalogue reads this from the latest release.
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          entries=()
          for p in watchlist-rss hue-sync cinemask-upgrades game-lights youtube-live; do
            downloads='{}'
            for zip in release/plugin-$p-${GITHUB_REF_NAME}-*.zip; do
              platform="${zip#release/plugin-$p-${GITHUB_REF_NAME}-}"; platform="${platform%.zip}"
              downloads=$(jq --arg k "$platform" --arg u "$base/${zip#release/}" --arg s "$(sha256sum "$zip" | cut -d' ' -f1)" \
                '. + {($k): {url: $u, sha256: $s}}' <<<"$downloads")
            done
            entries+=("$(jq --arg v "${GITHUB_REF_NAME#v}" --argjson d "$downloads" \
              '{id, name, description, version: $v, author: "BingeBandit", homepage: "https://github.com/'"${GITHUB_REPOSITORY}"'/blob/main/docs/PLUGINS.md", downloads: $d}' \
              "server/plugins/$p/plugin.json")")
          done
          printf '%s\n' "${entries[@]}" | jq -s '{name: "BingeBandit", plugins: .}' > release/plugin-catalog.json
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # The Android TV / Fire TV app. Signed with the release key when the
  # ANDROID_KEYSTORE* secrets are set (see apps/tv/README.md), else the debug key.
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install JS dependencies
        working-directory: apps/tv
        run: npm ci
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: apps/tv/android
        env:
          BB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleSideloadRelease -PbbVersion=${GITHUB_REF_NAME} -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      # The Google Play bundle (upload it in Play Console). Play rejects bundles
      # signed with the debug key, so it's only built with the release key.
      - name: Build Play bundle
        if: env.BB_KEYSTORE != ''
        working-directory: apps/tv/android
        env:
          BB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease -PbbVersion=${GITHUB_REF_NAME} -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64
      - name: Name the files
        run: |
          mkdir -p release
          cp apps/tv/android/app/build/outputs/apk/sideload/release/app-sideload-release.apk "release/BingeBandit-TV-${GITHUB_REF_NAME}.apk"
          aab=apps/tv/android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if [ -f "$aab" ]; then cp "$aab" "release/BingeBandit-TV-GooglePlay-${GITHUB_REF_NAME}.aab"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab

  # The Windows app (apps/desktop): an installer and a portable exe, with mpv inside.
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build
        working-directory: apps/desktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm run fetch-mpv
          npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/BingeBandit-Windows-*.exe

  # The Roku channel, as a zip to sideload in developer mode (apps/roku/README.md).
  roku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the channel zip
        working-directory: apps/roku
        run: |
          IFS=. read -r major minor patch <<< "${GITHUB_REF_NAME#v}"
          sed -i "s/^major_version=.*/major_version=${major:-0}/; s/^minor_version=.*/minor_version=${minor:-0}/; s/^build_version=.*/build_version=${patch%%[^0-9]*}/" manifest
          ./build.sh
          mkdir -p ../../release
          cp build/BingeBandit-Roku.zip "../../release/BingeBandit-Roku-${GITHUB_REF_NAME}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bingebandit
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
