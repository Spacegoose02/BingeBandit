# BingeBandit's mpv settings. This copy lives in the app's settings folder
# (%APPDATA%\BingeBandit\mpv) and is yours to change: the app never
# overwrites it. Delete it to get the defaults back.

# Decode with the graphics card when it's safe to.
hwdec=auto-safe
# Smoother motion and sharper scaling on most PCs.
profile=high-quality
video-sync=display-resample
# Tone-map HDR files for SDR screens; HDR screens get HDR.
target-colorspace-hint=yes

# To send Dolby and DTS audio to a receiver untouched, uncomment:
#audio-spdif=ac3,eac3,dts,dts-hd,truehd
#audio-exclusive=yes

# Subtitles
sub-auto=no
sub-font-size=44
