# BingeBandit's remote and keyboard keys in the player, on top of mpv's own
# (https://mpv.io/manual/stable/#interactive-control). This copy lives in
# %APPDATA%\BingeBandit\mpv and is yours to change. The bingebandit/...
# names are BingeBandit's player controls (they do the right thing for
# films, episodes and Live TV, and work the menu when it's open).

# Back on a remote, Escape or Backspace closes the menu or leaves the player.
ESC script-binding bingebandit/back
BS script-binding bingebandit/back
MBTN_BACK script-binding bingebandit/back

# OK / Enter: skip the intro or credits when offered, play what's up next,
# otherwise pause.
ENTER script-binding bingebandit/ok
KP_ENTER script-binding bingebandit/ok

# Left and right: back 10 seconds, forward 30, like the TV app.
LEFT script-binding bingebandit/left
RIGHT script-binding bingebandit/right
# Up and down: volume, or the channel on Live TV.
UP script-binding bingebandit/up
DOWN script-binding bingebandit/down
PGUP script-binding bingebandit/channel-up
PGDWN script-binding bingebandit/channel-down

# The menu key, M or Tab: audio, subtitles, channels and Watch Together.
MENU script-binding bingebandit/menu
m script-binding bingebandit/menu
TAB script-binding bingebandit/menu

# N: next episode. L: back to live.
n script-binding bingebandit/next
NEXT script-binding bingebandit/next
l script-binding bingebandit/go-live
SPACE script-binding bingebandit/play-pause
