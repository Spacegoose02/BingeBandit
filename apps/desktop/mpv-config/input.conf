# BingeBandit's remote and keyboard keys in the player, on top of mpv's own
# (https://mpv.io/manual/stable/#interactive-control). This copy lives in
# %APPDATA%\BingeBandit\mpv and is yours to change.

# Back on a remote, Escape or Backspace leaves the player.
ESC quit
BS quit
MBTN_BACK quit

# OK / Enter: skip the intro or credits when offered, otherwise pause.
ENTER script-message bb-enter
KP_ENTER script-message bb-enter

# Left and right: back 10 seconds, forward 30, like the TV app.
LEFT seek -10
RIGHT seek 30
UP add volume 5
DOWN add volume -5

# N: next episode
n script-message bb-next
NEXT script-message bb-next
